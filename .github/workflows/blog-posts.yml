# 블로그(gawon-log) 공개 글 최신 3개를 README 의 최근 글 칸에 갱신함
# 글 목록이 바뀐 때만 main 에 봇 커밋이 생김
name: 블로그 최근 글

on:
  schedule:
    - cron: "0 */6 * * *" # 6시간마다
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/blog-posts.yml
      - .github/scripts/update-blog-posts.mjs

permissions:
  contents: write

concurrency:
  group: blog-posts
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # 표지를 카드 크기로 맞출 때 씀. 러너 이미지에 없을 때만 설치
      - name: ImageMagick 준비
        run: |
          if ! command -v magick >/dev/null && ! command -v convert >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq imagemagick
          fi

      - name: 최근 글 칸 다시 만들기
        run: node .github/scripts/update-blog-posts.mjs

      # 그 사이 main 에 다른 커밋이 올라왔을 수 있어 rebase 후 올림
      - name: 바뀌었으면 커밋하고 올리기
        run: |
          if [ -z "$(git status --porcelain README.md assets/blog)" ]; then
            echo "바뀐 글 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/blog
          git commit -m "docs(readme): 블로그 최근 글 목록 갱신함" -m "- 블로그 API 공개 글 기준으로 최근 글 칸과 표지를 다시 만듦"
          git pull --rebase origin main
          git push origin HEAD:main
